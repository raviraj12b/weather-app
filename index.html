<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forcast App</title>
    <link rel="stylesheet " href="css/style.css">
</head>
<body>

  <header class="app-header">
    <h1 class="app-title"><span aria-hidden="true">🌤️</span> Weather Forecast</h1>
  </header>

  <main>
    <section class="search-section">
      <form id="search-form">
        <label for="city-input" class="sr-only">Search city</label>
        <input
          type="text"
          id="city-input"
          name="city"
          placeholder="Enter city name..."
          autocomplete="off"
          required
        />
        <button type="submit" id="search-button">Search</button>
      </form>
    </section>

    <p id="error-message" class="error-message"role="alert" hidden></p>

    <div id ="loading-indicator" class="loading-indicator" role="status" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <span>Fetching Weather...</span>
    </div>

    <section id="current-weather" class="weather-card" aria-live="polite">
      <!-- Filled dynamically by ui.js — Phase 9 -->
    </section>

    <section class="forecast-section">
      <h2>5-Day Forecast</h2>
      <div id="forecast-container" class="forecast-container">
      <!--TEMPORARY placeholder cards, for testing the Grid layout only.
       These get deleted in Phase 11 once JS generates real cards from API data -->
       <div class="forecast-day-card">Mon</div>
       <div class="forecast-day-card">Tue</div>
       <div class="forecast-day-card">Wed</div>
       <div class="forecast-day-card">Thu</div>
       <div class="forecast-day-card">Fri</div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>Powered by OpenWeatherMap API</p>
  </footer>

  
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
